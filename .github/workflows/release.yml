# Tests the add-on, builds the .ankiaddon package and attaches it to a
# release that you published. Publishing it yourself (rather than letting
# this workflow create it) is what makes GitHub show you as its author.
#
# To release: update "version" in manifest.json, commit and push, then
#   git tag -a v3.0.1 -F notes.md --cleanup=verbatim
#   git push origin v3.0.1
#   gh release create v3.0.1 --title "Anki Vim Mode 3.0.1" --notes-from-tag
# (--cleanup=verbatim keeps lines starting with "#", e.g. markdown headings.)
# The package appears on the release a minute or so later.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches manifest.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          node --check editor_vim.js
          node tests/test_text.js
          python3 -m py_compile __init__.py vim_core.py

      - name: Build package
        run: ./build.sh "anki_vim_mode-$TAG.ankiaddon"

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "anki_vim_mode-$TAG.ankiaddon" --clobber
